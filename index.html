/* LOADER */
#loader{
    position:fixed;
    inset:0;
    background:#050816;

    align-items:center;
    justify-content:center;
    z-index:99999;
    transition:.6s;
}

.loader-box{
    text-align:center;
}

.loader-logo{
    font-size:42px;
    font-weight:bold;
    color:#00e5ff;
    animation:pulse 1s infinite alternate;
}

.loader-text{
    color:#777;
    margin-top:10px;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.12);}
}

/* SCROLL PROGRESS */
#progress{
    position:fixed;
    top:0;
    left:0;
    height:4px;
    width:0%;
    background:linear-gradient(90deg,#00e5ff,#7c3aed,#ff4ecd);
    z-index:10000;
}

body::before{
    content:"";

    width:500px;
    height:500px;
    top:-180px;
    left:-150px;
    background:#7c3aed;
    filter:blur(160px);
    opacity:.22;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    right:-150px;
    bottom:-180px;

}
