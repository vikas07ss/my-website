<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background: #f4f6f8;
    color: #111827;

    transition: 0.3s;
}

body.dark {
    background: #0b0f19;
    color: white;
}

nav {
    background: #111;
    padding: 18px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
}

.container {
    width: 90%;
    max-width: 400px;

    margin: 70px auto;

    text-align: center;
}

.calculator {

    background: white;

    padding: 25px;

    border-radius: 22px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.15);

}

.dark .calculator {
    background: #1b2230;
}

#display {

    width: 100%;

    height: 70px;

    margin-bottom: 15px;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 12px;

    font-size: 28px;

    text-align: right;

    background: #f8fafc;

    color: #111;

}

.dark #display {

    background: #111827;

    color: white;

}

.buttons {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

}

.buttons button {

    height: 60px;

    border: none;

    border-radius: 12px;

    font-size: 19px;

    cursor: pointer;

    background: #e5e7eb;

    color: #111;

}

.dark .buttons button {

    background: #374151;

    color: white;

}

.buttons button:hover {

    transform: scale(1.04);

}

.operator {

    background: #111827 !important;

    color: white !important;

}

.equal {

    grid-column: span 2;

}

</style>

</head>


<body>


<nav>

    <a href="index.html">
        🏠 Portfolio
    </a>

    <a href="todo.html">
        📝 To-Do
    </a>

    <button onclick="toggleDark()">
        🌙
    </button>

</nav>


<div class="container">

    <h1>🧮 Calculator</h1>

    <p>JavaScript Calculator</p>


    <div class="calculator">

        <input
            id="display"
            type="text"
            readonly>


        <div class="buttons">

            <button onclick="clearDisplay()">
                C
            </button>

            <button onclick="deleteLast()">
                ⌫
            </button>

            <button onclick="add('%')">
                %
            </button>

            <button
                class="operator"
                onclick="add('/')">
                ÷
            </button>


            <button onclick="add('7')">7</button>

            <button onclick="add('8')">8</button>

            <button onclick="add('9')">9</button>

            <button
                class="operator"
                onclick="add('*')">
                ×
            </button>


            <button onclick="add('4')">4</button>

            <button onclick="add('5')">5</button>

            <button onclick="add('6')">6</button>

            <button
                class="operator"
                onclick="add('-')">
                −
            </button>


            <button onclick="add('1')">1</button>

            <button onclick="add('2')">2</button>

            <button onclick="add('3')">3</button>

            <button
                class="operator"
                onclick="add('+')">
                +
            </button>


            <button onclick="add('0')">
                0
            </button>

            <button onclick="add('.')">
                .
            </button>

            <button
                class="operator equal"
                onclick="calculate()">
                =
            </button>

        </div>

    </div>

</div>


<script>

const display =
    document.getElementById("display");


function add(value) {

    display.value += value;

}


function clearDisplay() {

    display.value = "";

}


function deleteLast() {

    display.value =
        display.value.slice(0, -1);

}


function calculate() {

    try {

        if (display.value === "") {

            return;

        }


        let expression =
            display.value.replace(
                /%/g,
                "/100"
            );


        let result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        display.value = result;

    }

    catch {

        display.value = "Error";

        setTimeout(
            clearDisplay,
            800
        );

    }

}


document.addEventListener(
    "keydown",
    function(event) {

        if (
            /[0-9+\-*/.%]/.test(event.key)
        ) {

            add(event.key);

        }


        if (event.key === "Enter") {

            calculate();

        }


        if (event.key === "Backspace") {

            deleteLast();

        }


        if (event.key === "Escape") {

            clearDisplay();

        }

    }
);


function toggleDark() {

    document.body.classList.toggle("dark");

}

</script>

</body>
</html>
